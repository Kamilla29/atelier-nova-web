name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify required static assets
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/main.js
          test -f public/favicon.svg
          test -f public/assets/project-1.svg
